name: dao-stellar-events
resource_size: s
description: Index the testnet DAO deployment with Goldsky Turbo

sources:
  stellar_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 4551728

transforms:
  dao_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        id AS event_id,
        'builder-testnet' AS deployment_id,
        contract_id,
        CASE contract_id
          WHEN 'CBGLIC3VDPNSXRQTHIHADJVL3WVM54ZIO7FV23SDC3DQTTDLO2NMYUK7' THEN 'token'
          WHEN 'CCWTJATDBQN5H2M4RFTCB7Z3SHEMVZUXEB6YA7CHO5QME6AS55IUMEHI' THEN 'governor'
          WHEN 'CCPNKK3XDYHX57MNAUSWNRHDZKDOIG7DOGV43I4N3LJ74KK7TVZLXVW2' THEN 'treasury'
          WHEN 'CBHISFJ2I27W7LWUYE3MX5ZS732BPVKPJ2BTO3ASSYAPEBSV7YZYD66E' THEN 'auction'
          ELSE 'unknown'
        END AS contract_role,
        topics,
        data,
        transaction_hash,
        transaction_successful,
        ledger_sequence,
        ledger_hash,
        ledger_closed_at,
        transaction_index,
        operation_index,
        event_index,
        operation_type,
        _gs_op
      FROM stellar_events
      WHERE contract_id IN (
        'CBGLIC3VDPNSXRQTHIHADJVL3WVM54ZIO7FV23SDC3DQTTDLO2NMYUK7',
        'CCWTJATDBQN5H2M4RFTCB7Z3SHEMVZUXEB6YA7CHO5QME6AS55IUMEHI',
        'CCPNKK3XDYHX57MNAUSWNRHDZKDOIG7DOGV43I4N3LJ74KK7TVZLXVW2',
        'CBHISFJ2I27W7LWUYE3MX5ZS732BPVKPJ2BTO3ASSYAPEBSV7YZYD66E'
      )

  raw_events:
    type: script
    from: dao_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      topics: string
      data: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
    script: |
      function invoke(data) {
        function stringify(value) {
          if (value === undefined || value === null) {
            return null;
          }

          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              return value;
            }
          }

          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        }

        return {
          event_id: data.event_id || data.id,
          deployment_id: data.deployment_id || null,
          contract_id: data.contract_id || null,
          contract_role: data.contract_role || 'unknown',
          topics: stringify(data.topics),
          data: stringify(data.data ?? data.payload ?? data),
          transaction_hash: data.transaction_hash || null,
          transaction_successful: data.transaction_successful ?? null,
          ledger_sequence: data.ledger_sequence ?? null,
          ledger_hash: data.ledger_hash ?? null,
          ledger_closed_at: data.ledger_closed_at ?? null,
          transaction_index: data.transaction_index ?? null,
          operation_index: data.operation_index ?? null,
          event_index: data.event_index ?? null,
          operation_type: data.operation_type ?? null,
          _gs_op: data._gs_op ?? null
        };
      }

  decoded_events:
    type: script
    from: raw_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      event_name: string
      event_type: string
      payload: string
      proposal_id: string
      proposal_number: string
      actor: string
      amount: string
      token_id: string
      bidder: string
      minter: string
      owner: string
      from_address: string
      to_address: string
      changed_by: string
      cancelled_by: string
      executor: string
      governor: string
      treasury: string
      new_treasury: string
      new_governor: string
      token_contract: string
      token_contract_id: string
      target: string
      function: string
      support: string
      reason: string
      state: string
      eta: string
      description: string
      snapshot_ledger: string
      vote_start_timestamp: string
      deadline_ledger: string
      action_count: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
    script: |
      function invoke(data) {
        function parsePayload(value) {
          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              try {
                return parsePayload(JSON.parse(trimmed));
              } catch {
                return null;
              }
            }
          }

          if (value && typeof value === 'object') {
            return value;
          }

          return null;
        }

        function pick(payload, keys) {
          for (var i = 0; i < keys.length; i += 1) {
            var key = keys[i];
            if (payload && payload[key] !== undefined && payload[key] !== null && payload[key] !== '') {
              return payload[key];
            }
          }

          return undefined;
        }

        function stringify(value) {
          if (value === undefined || value === null) {
            return null;
          }

          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              return value;
            }
          }

          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        }

        var payload = parsePayload(data.data) || parsePayload(data.payload) || parsePayload(data);
        var eventName = data.event_name || data.event_type || pick(payload, ['event_name', 'event_type']);
        if (!eventName) {
          return null;
        }

        var proposalId = pick(payload, ['proposal_id', 'proposalId']);
        var actor = pick(payload, ['actor', 'proposer', 'voter', 'bidder', 'minter', 'owner', 'changed_by', 'cancelled_by', 'executor', 'governor', 'treasury', 'new_treasury', 'new_governor']);
        var tokenId = pick(payload, ['token_id', 'tokenId']);
        var amount = pick(payload, ['amount', 'weight']);
        var target = pick(payload, ['target']);
        var functionName = pick(payload, ['function']);

        return {
          event_id: data.event_id || data.id || null,
          deployment_id: data.deployment_id || null,
          contract_id: data.contract_id || null,
          contract_role: data.contract_role || 'unknown',
          event_name: String(eventName),
          event_type: data.event_type || null,
          payload: stringify(payload || data.data || data),
          proposal_id: proposalId || null,
          proposal_number: pick(payload, ['proposal_number']) || null,
          actor: actor || null,
          amount: amount ?? null,
          token_id: tokenId ?? null,
          bidder: pick(payload, ['bidder']) || null,
          minter: pick(payload, ['minter']) || null,
          owner: pick(payload, ['owner']) || null,
          from_address: pick(payload, ['from', 'from_delegate']) || null,
          to_address: pick(payload, ['to', 'to_delegate']) || null,
          changed_by: pick(payload, ['changed_by']) || null,
          cancelled_by: pick(payload, ['cancelled_by']) || null,
          executor: pick(payload, ['executor']) || null,
          governor: pick(payload, ['governor']) || null,
          treasury: pick(payload, ['treasury']) || null,
          new_treasury: pick(payload, ['new_treasury']) || null,
          new_governor: pick(payload, ['new_governor']) || null,
          token_contract: pick(payload, ['token_contract']) || null,
          token_contract_id: pick(payload, ['token_contract_id']) || null,
          target: target || null,
          function: functionName || null,
          support: pick(payload, ['support']) || null,
          reason: pick(payload, ['reason']) || null,
          state: pick(payload, ['state']) || null,
          eta: pick(payload, ['eta']) || null,
          description: pick(payload, ['description']) || null,
          snapshot_ledger: pick(payload, ['snapshot', 'vote_snapshot']) || null,
          vote_start_timestamp: pick(payload, ['vote_start']) || null,
          deadline_ledger: pick(payload, ['deadline', 'vote_end']) || null,
          action_count: pick(payload, ['action_count']) || null,
          transaction_hash: data.transaction_hash || null,
          transaction_successful: data.transaction_successful ?? null,
          ledger_sequence: data.ledger_sequence ?? null,
          ledger_hash: data.ledger_hash || null,
          ledger_closed_at: data.ledger_closed_at || null,
          transaction_index: data.transaction_index ?? null,
          operation_index: data.operation_index ?? null,
          event_index: data.event_index ?? null,
          operation_type: data.operation_type || null,
          _gs_op: data._gs_op || null
        };
      }

  activity_feed:
    type: script
    from: decoded_events
    language: typescript
    primary_key: activity_id
    schema:
      activity_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      kind: string
      title: string
      summary: string
      proposal_id: string
      proposal_number: string
      actor: string
      addresses: string
      ledger_sequence: int64
      timestamp: string
      transaction_hash: string
    script: |
      function invoke(data) {
        function parsePayload(value) {
          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              try {
                return parsePayload(JSON.parse(trimmed));
              } catch {
                return null;
              }
            }
          }

          if (value && typeof value === 'object') {
            return value;
          }

          return null;
        }

        function pick(row, keys) {
          var payload = parsePayload(row.payload) || parsePayload(row.data);
          for (var i = 0; i < keys.length; i += 1) {
            var key = keys[i];
            if (row[key] !== undefined && row[key] !== null && row[key] !== '') {
              return row[key];
            }
            if (payload && payload[key] !== undefined && payload[key] !== null && payload[key] !== '') {
              return payload[key];
            }
          }
          return undefined;
        }

        function unique(values) {
          var seen = {};
          var out = [];
          for (var i = 0; i < values.length; i += 1) {
            var value = values[i];
            if (!value || seen[value]) {
              continue;
            }
            seen[value] = true;
            out.push(value);
          }
          return out;
        }

        var eventName = data.event_name || data.event_type;
        if (!eventName) {
          return null;
        }

        var kindMap = {
          TokenInitialized: 'token.initialized',
          MintWithMinter: 'token.mint',
          BatchMint: 'token.batch_mint',
          MintAuthorityChanged: 'token.mint_authority_changed',
          GovernorInitialized: 'governance.initialized',
          ProposalQueued: 'governance.proposal_queued',
          TreasuryChanged: 'governance.treasury_changed',
          TokenContractChanged: 'governance.token_contract_changed',
          QueueDelayChanged: 'governance.queue_delay_changed',
          VotingDelayChanged: 'governance.voting_delay_changed',
          VotingPeriodChanged: 'governance.voting_period_changed',
          ProposalThresholdChanged: 'governance.proposal_threshold_changed',
          QuorumBpsChanged: 'governance.quorum_bps_changed',
          GovernorAuthorityChanged: 'governance.authority_changed',
          TreasuryInitialized: 'treasury.initialized',
          GovernorChanged: 'treasury.governor_changed',
          Execute: 'treasury.execute',
          AuctionInitialized: 'auction.initialized',
          AuctionCreated: 'auction.created',
          BidPlaced: 'auction.bid_placed',
          AuctionSettled: 'auction.settled',
          DurationUpdated: 'auction.duration_updated',
          ReservePriceUpdated: 'auction.reserve_price_updated',
          MinBidIncrementUpdated: 'auction.min_bid_increment_updated',
          TimeBufferUpdated: 'auction.time_buffer_updated',
          PaymentTokenUpdated: 'auction.payment_token_updated',
          TreasuryUpdated: 'auction.treasury_updated',
          BidRefunded: 'auction.bid_refunded',
          AuctionCancelled: 'auction.cancelled'
        };

        var titleMap = {
          TokenInitialized: 'Token initialized',
          MintWithMinter: 'Token minted',
          BatchMint: 'Batch mint completed',
          MintAuthorityChanged: 'Mint authority changed',
          GovernorInitialized: 'Governor initialized',
          ProposalQueued: 'Proposal queued',
          TreasuryChanged: 'Treasury changed',
          TokenContractChanged: 'Token contract changed',
          QueueDelayChanged: 'Queue delay updated',
          VotingDelayChanged: 'Voting delay updated',
          VotingPeriodChanged: 'Voting period updated',
          ProposalThresholdChanged: 'Proposal threshold updated',
          QuorumBpsChanged: 'Quorum updated',
          GovernorAuthorityChanged: 'Governor authority changed',
          TreasuryInitialized: 'Treasury initialized',
          GovernorChanged: 'Governor changed',
          Execute: 'Treasury executed call',
          AuctionInitialized: 'Auction initialized',
          AuctionCreated: 'Auction created',
          BidPlaced: 'Bid placed',
          AuctionSettled: 'Auction settled',
          DurationUpdated: 'Auction duration updated',
          ReservePriceUpdated: 'Reserve price updated',
          MinBidIncrementUpdated: 'Minimum bid increment updated',
          TimeBufferUpdated: 'Time buffer updated',
          PaymentTokenUpdated: 'Payment token updated',
          TreasuryUpdated: 'Treasury updated',
          BidRefunded: 'Bid refunded',
          AuctionCancelled: 'Auction cancelled'
        };

        var addresses = unique([
          pick(data, ['actor']),
          pick(data, ['proposer']),
          pick(data, ['bidder']),
          pick(data, ['minter']),
          pick(data, ['owner']),
          pick(data, ['changed_by']),
          pick(data, ['cancelled_by']),
          pick(data, ['executor']),
          pick(data, ['governor']),
          pick(data, ['treasury']),
          pick(data, ['new_treasury']),
          pick(data, ['new_governor']),
          pick(data, ['token_contract']),
          pick(data, ['token_contract_id']),
          pick(data, ['contract_id'])
        ]);

        var summary;
        if (eventName === 'ProposalQueued') {
          summary = 'Proposal ' + (pick(data, ['proposal_id']) || '') + ' queued';
        } else if (eventName === 'BidPlaced') {
          summary = 'Bid of ' + (pick(data, ['amount']) || 'unknown') + ' placed on token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (eventName === 'AuctionSettled') {
          summary = 'Auction settled for token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (eventName === 'AuctionCreated') {
          summary = 'Auction created for token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (eventName === 'Execute') {
          summary = 'Executed ' + (pick(data, ['function']) || 'call') + ' on ' + (pick(data, ['target']) || 'target');
        } else if (eventName === 'MintWithMinter') {
          summary = 'Minted ' + (pick(data, ['token_id']) || 'token') + ' to ' + (pick(data, ['to']) || 'recipient');
        } else if (eventName === 'BatchMint') {
          summary = 'Minted ' + (pick(data, ['amount']) || 'batch') + ' tokens';
        } else if (titleMap[eventName]) {
          summary = titleMap[eventName];
        } else {
          summary = String(eventName).replace(/_/g, ' ');
        }

        return {
          activity_id: data.id,
          deployment_id: data.deployment_id,
          contract_id: data.contract_id,
          contract_role: data.contract_role,
          kind: kindMap[eventName] || ('contract.' + String(eventName).toLowerCase()),
          title: titleMap[eventName] || String(eventName),
          summary: summary,
          proposal_id: pick(data, ['proposal_id']) || null,
          proposal_number: pick(data, ['proposal_number']) || null,
          actor: pick(data, ['actor', 'proposer', 'bidder', 'minter', 'owner', 'changed_by', 'cancelled_by', 'executor', 'governor', 'treasury', 'new_treasury', 'new_governor']) || null,
          addresses: JSON.stringify(addresses),
          ledger_sequence: data.ledger_sequence,
          timestamp: data.timestamp || data.ledger_closed_at || null,
          transaction_hash: data.transaction_hash
        };
      }

sinks:
  raw_events_output:
    type: postgres
    from: raw_events
    schema: chain
    table: raw_events
    secret_name: DAO_POSTGRES
    primary_key: event_id

  decoded_events_output:
    type: postgres
    from: decoded_events
    schema: chain
    table: decoded_events
    secret_name: DAO_POSTGRES
    primary_key: event_id

  activity_feed_output:
    type: postgres
    from: activity_feed
    schema: app
    table: activity_feed
    secret_name: DAO_POSTGRES
    primary_key: activity_id
